<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>連珠成五 · 在线五子棋</title>
<meta name="description" content="多人实时五子棋对战平台，支持双人对弈、旁观观战与弹幕聊天。" />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e9eef5'/%3E%3Ccircle cx='24' cy='26' r='10' fill='%23222b36'/%3E%3Ccircle cx='40' cy='40' r='10' fill='%23ffffff' stroke='%23949fae' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="gomoku.css" />
</head>
<body>
<div class="bg-glow"></div>

<header class="topbar">
  <div class="brand" id="brandHome">
    <span class="brand-seal five">五</span>
    <div class="brand-text">
      <strong>連珠成五</strong>
      <span>在线五子棋</span>
    </div>
  </div>
  <div class="topbar-right">
    <a class="btn btn-ghost btn-sm topbar-home" href="/">← 游戏大厅</a>
    <div class="stat"><em id="statRooms">0</em><span>棋室</span></div>
    <div class="stat"><em id="statLive">0</em><span>对局中</span></div>
  </div>
</header>

<!-- ================= 大厅 ================= -->
<section id="lobby" class="view">
  <div class="hero">
    <h1>連珠成五，先手争锋</h1>
    <p>十五路棋盘，黑先白后，先连成五子者胜 —— 把棋室的链接发给朋友，即刻开局。</p>
    <div class="create-box">
      <input id="nickInput" class="input" maxlength="12" placeholder="你的昵称" autocomplete="nickname" />
      <input id="roomNameInput" class="input" maxlength="12" placeholder="棋室名（可选）" />
      <button id="createBtn" class="btn btn-primary">创建棋室 · 执黑先手</button>
    </div>
  </div>

  <div class="lobby-section">
    <div class="section-head">
      <h2>棋室大厅</h2>
      <button id="refreshBtn" class="btn btn-ghost btn-sm">刷新</button>
    </div>
    <div id="roomGrid" class="room-grid">
      <div class="empty-hint">正在加载棋室…</div>
    </div>
  </div>
</section>

<!-- ================= 棋室 ================= -->
<section id="roomView" class="view hidden">
  <div class="room-bar">
    <button id="backBtn" class="btn btn-ghost btn-sm">← 返回大厅</button>
    <div class="room-title">
      <h2 id="roomTitle">棋室</h2>
      <span id="roomStatus" class="chip">等待中</span>
      <span id="lastMove" class="last-move"></span>
    </div>
    <button id="inviteBtn" class="btn btn-ghost btn-sm">复制邀请链接</button>
  </div>

  <div class="room-layout">
    <!-- 左侧：棋手与操作 -->
    <aside class="panel side-panel">
      <div class="side-block">
        <div class="seat" id="seatBlack">
          <div class="avatar black">黑</div>
          <div class="seat-info">
            <div class="seat-name">虚位以待</div>
            <div class="seat-meta">黑方 · 先手</div>
          </div>
          <div class="seat-clock" id="clockBlack">1:00</div>
        </div>
        <div class="divider"><span>VS</span></div>
        <div class="seat" id="seatWhite">
          <div class="avatar white">白</div>
          <div class="seat-info">
            <div class="seat-name">虚位以待</div>
            <div class="seat-meta">白方 · 后手</div>
          </div>
          <div class="seat-clock" id="clockWhite">1:00</div>
        </div>
      </div>

      <div class="side-block">
        <div class="hint" id="turnHint">等待棋手入座…</div>
        <div class="actions">
          <button id="resignBtn" class="btn btn-danger btn-sm">认输</button>
          <button id="rematchBtn" class="btn btn-ghost btn-sm">重新开始</button>
        </div>
      </div>

      <div class="side-block spectators">
        <div class="spectator-head">
          <span>观战区</span>
          <em id="specCount">0</em>
        </div>
        <div id="specList" class="spec-list">还没有人观战</div>
      </div>

      <div class="side-block move-log-block">
        <div class="spectator-head">
          <span>棋谱</span>
          <em id="moveCount">0</em>
        </div>
        <div id="moveLog" class="move-log">
          <div class="move-empty">开局后此处记录落子坐标</div>
        </div>
      </div>

      <div class="side-block my-role">
        <span class="my-role-label">我的身份</span>
        <strong id="myRole">观战者</strong>
      </div>
    </aside>

    <!-- 中间：棋盘 -->
    <div class="stage">
      <div class="board-frame gomoku-board-frame">
        <canvas id="boardCanvas"></canvas>
        <div id="danmakuLayer" class="danmaku-layer"></div>
        <div id="banner" class="banner hidden"></div>
        <div id="joinOverlay" class="join-overlay hidden">
          <div class="join-card">
            <h3>加入棋室</h3>
            <p id="joinDesc">先到先得，空位可入座</p>
            <div class="join-actions">
              <button class="btn btn-black" data-seat="b">执黑 <small>先手</small></button>
              <button class="btn btn-white" data-seat="w">执白 <small>后手</small></button>
              <button class="btn btn-ghost" data-seat="spec">观战</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：聊天/弹幕 -->
    <aside class="panel chat-panel">
      <div class="chat-head">
        <span>棋室弹幕</span>
        <label class="switch">
          <input type="checkbox" id="danmakuToggle" checked />
          <span>弹幕</span>
        </label>
      </div>
      <div id="chatList" class="chat-list"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" class="input" maxlength="60" placeholder="说点什么，会飘在棋盘上…" autocomplete="off" />
        <button class="btn btn-primary btn-sm" type="submit">发送</button>
      </form>
    </aside>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="gomoku.js"></script>
</body>
</html>
