<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>弈 · 在线棋室 | 象棋 · 五子棋</title>
<meta name="description" content="在线棋室：中国象棋与五子棋，双人实时对弈、自由观战与弹幕聊天。" />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8c88a'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' font-family='serif' fill='%235a2b12'%3E弈%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="home.css" />
<script>
  // 兼容旧版象棋邀请链接：/#r=xxxxxxxx → /xiangqi.html#r=xxxxxxxx
  if (/^#r=[a-f0-9]{8}$/.test(location.hash)) {
    location.replace('/xiangqi.html' + location.hash);
  }
</script>
</head>
<body>
<div class="bg-glow"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-seal">弈</span>
    <div class="brand-text">
      <strong>弈 · 在线棋室</strong>
      <span>两种棋局，一间棋室</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="stat"><em id="statAll">–</em><span>棋室</span></div>
    <div class="stat"><em id="statLiveAll">–</em><span>对局中</span></div>
  </div>
</header>

<main class="home-view">
  <section class="home-hero">
    <h1>今夜，下哪一局？</h1>
    <p>中国象棋与五子棋，双人实时对弈 · 自由观战 · 弹幕助威。<br />选一种棋，把棋室链接发给朋友，即刻开局。</p>
  </section>

  <section class="game-grid">
    <a class="game-card chess" href="/xiangqi.html">
      <div class="card-seal">帥</div>
      <div class="card-body">
        <div class="card-kicker">XIANGQI · 楚河漢界</div>
        <h2>中国象棋</h2>
        <p>车马炮相仕帅兵卒，完整的服务端棋规校验与中式记谱。每步 90 秒，观战者可以弹幕助威。</p>
        <div class="card-meta">
          <span><em data-rooms="chess">–</em> 间棋室</span>
          <span><em data-live="chess">–</em> 局进行中</span>
        </div>
        <span class="card-cta">进入象棋</span>
      </div>
    </a>

    <a class="game-card gomoku" href="/gomoku.html">
      <div class="card-seal five">五</div>
      <div class="card-body">
        <div class="card-kicker">GOMOKU · 連珠成五</div>
        <h2>五子棋</h2>
        <p>十五路棋盘，黑先白后，率先连成五子者胜。棋室、观战与弹幕一应俱全，随时开一局。</p>
        <div class="card-meta">
          <span><em data-rooms="gomoku">–</em> 间棋室</span>
          <span><em data-live="gomoku">–</em> 局进行中</span>
        </div>
        <span class="card-cta">进入五子棋</span>
      </div>
    </a>
  </section>

  <footer class="home-foot">无需注册 · 打开即玩 · 棋局结束后可双方确认重开</footer>
</main>

<script>
  async function loadStats() {
    const jobs = [
      fetch('/api/rooms', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
        const rooms = d.rooms || [];
        return { key: 'chess', rooms: rooms.length, live: rooms.filter((x) => x.status === 'playing').length };
      }),
      fetch('/api/gomoku/rooms', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
        const rooms = d.rooms || [];
        return { key: 'gomoku', rooms: rooms.length, live: rooms.filter((x) => x.status === 'playing').length };
      }),
    ];
    const results = await Promise.allSettled(jobs);
    let total = 0;
    let live = 0;
    let ok = false;
    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      ok = true;
      const d = r.value;
      total += d.rooms;
      live += d.live;
      document.querySelectorAll('[data-rooms="' + d.key + '"]').forEach((el) => { el.textContent = d.rooms; });
      document.querySelectorAll('[data-live="' + d.key + '"]').forEach((el) => { el.textContent = d.live; });
    }
    if (ok) {
      document.getElementById('statAll').textContent = total;
      document.getElementById('statLiveAll').textContent = live;
    }
  }
  loadStats();
  setInterval(loadStats, 5000);
</script>
</body>
</html>
